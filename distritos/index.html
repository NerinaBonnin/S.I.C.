<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panem S.I.C // Monitoreo de distritos</title>
  <link rel="stylesheet" href="../src/css/main.css">
  <link rel="stylesheet" href="../src/css/page/distritos.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="districts-container">
    <header class="page-title-section">
      <span class="hud-subtitle"> MONITOREO TERRITORIAL // SECTORIAL </span>
      <h1 class="hud-title"> MAPA INTERACTIVO DE PANEM </h1>
      <p class="hud-description">
        Selecciona o interactura con las regiones de Panem para desplegar la ficha biometrica, especialidad y registros tácticos de cada distrito.
      </p>
    </header>

    <div class="districts-layout">
      <section class="map-viewport" id="map-container"></section>
      <aside class="district-info-panel" id="district-info-panel">
        <div class="panel-placeholder">
          <div class="radar-scan-line"></div>
          <p> SELECCIONA UN DISTRITO EN EL MAPA PARA INICIAR EL ESCANEO</p>
        </div>
      </aside>
    </div>
  </main>

  <script type="module" src="../src/js/pages/distritos.js"></script>
